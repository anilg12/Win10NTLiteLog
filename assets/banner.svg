<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Win10 NTLite Log - Windows 10 hafifletme notlari">
  <title>Win10 NTLite Log</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070C17"/>
      <stop offset=".6" stop-color="#0B1426"/>
      <stop offset="1" stop-color="#060A12"/>
    </linearGradient>
    <radialGradient id="glow" cx=".2" cy=".5" r=".55">
      <stop offset="0" stop-color="#0078D6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0078D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/>
      <stop offset="1" stop-color="#0063B1"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CC4FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7CC4FF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7CC4FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#12203A" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
    <clipPath id="logoClip"><path d="M70 104 L170 90 L170 166 L70 166 Z M178 89 L298 72 L298 166 L178 166 Z M70 174 L170 174 L170 250 L70 236 Z M178 174 L298 174 L298 268 L178 251 Z"/></clipPath>
    <style>
      .t { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: Consolas, 'Cascadia Mono', 'SF Mono', Menlo, 'Courier New', monospace; }
      .p1, .p2, .p3, .p4 { animation: pane 4.8s ease-in-out infinite; }
      .p2 { animation-delay: .3s; } .p3 { animation-delay: .6s; } .p4 { animation-delay: .9s; }
      @keyframes pane { 0%, 100% { opacity: 1; } 40% { opacity: .55; } 60% { opacity: 1; } }
      .sw { animation: sw 3.6s cubic-bezier(.6,0,.4,1) infinite; }
      @keyframes sw { 0% { transform: translateX(-260px); } 100% { transform: translateX(300px); } }
      .l1 { animation: l1 9s infinite; } .l2 { animation: l2 9s infinite; } .l3 { animation: l3 9s infinite; }
      .l4 { animation: l4 9s infinite; } .l5 { animation: l5 9s infinite; } .l6 { animation: l6 9s infinite; }
      .l7 { animation: l7 9s infinite; }
      @keyframes l1 { 0%, 2% { opacity: 0; } 5%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes l2 { 0%, 11% { opacity: 0; } 14%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes l3 { 0%, 22% { opacity: 0; } 25%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes l4 { 0%, 32% { opacity: 0; } 35%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes l5 { 0%, 42% { opacity: 0; } 45%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes l6 { 0%, 54% { opacity: 0; } 57%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes l7 { 0%, 68% { opacity: 0; } 71%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      .bar { transform-origin: 0 0; animation: bar 9s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes bar { 0% { transform: scaleX(0); } 70% { transform: scaleX(1); } 92% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" opacity=".55"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- windows 10 logo -->
    <g transform="translate(4 30) scale(.82)">
      <path class="p1" d="M70 104 L170 90 L170 166 L70 166 Z" fill="url(#pane)"/>
      <path class="p2" d="M178 89 L298 72 L298 166 L178 166 Z" fill="url(#pane)"/>
      <path class="p3" d="M70 174 L170 174 L170 250 L70 236 Z" fill="url(#pane)"/>
      <path class="p4" d="M178 174 L298 174 L298 268 L178 251 Z" fill="url(#pane)"/>
      <g clip-path="url(#logoClip)"><rect class="sw" x="0" y="60" width="140" height="220" fill="url(#sweep)"/></g>
    </g>

    <!-- title -->
    <text class="t" x="290" y="140" font-size="48" font-weight="700" fill="#FFFFFF" letter-spacing="-.5">Win10 NTLite Log</text>
    <text class="t" x="292" y="176" font-size="20" fill="#9CC3FF">Windows 10 hafifletme notlarım</text>

    <g class="t" font-size="14" font-weight="600" transform="translate(-50 0)">
      <rect x="342" y="204" width="132" height="32" rx="16" fill="#0E2442" stroke="#1F4C85"/>
      <text x="408" y="225" text-anchor="middle" fill="#CFE5FF">44 hizmet kapalı</text>
      <rect x="484" y="204" width="168" height="32" rx="16" fill="#0E2442" stroke="#1F4C85"/>
      <text x="568" y="225" text-anchor="middle" fill="#CFE5FF">5 telemetri görevi silindi</text>
      <rect x="342" y="246" width="132" height="32" rx="16" fill="#0E2442" stroke="#1F4C85"/>
      <text x="408" y="267" text-anchor="middle" fill="#CFE5FF">NTLite 2025.3</text>
      <rect x="484" y="246" width="168" height="32" rx="16" fill="#0E2442" stroke="#1F4C85"/>
      <text x="568" y="267" text-anchor="middle" fill="#CFE5FF">Nisan 2025</text>
    </g>

    <!-- terminal -->
    <g transform="translate(708 46)">
      <rect width="456" height="248" rx="12" fill="#050913" stroke="#1B2B47"/>
      <rect width="456" height="34" rx="12" fill="#0C1628"/>
      <rect y="22" width="456" height="12" fill="#0C1628"/>
      <circle cx="20" cy="17" r="5" fill="#FF5F57"/>
      <circle cx="38" cy="17" r="5" fill="#FEBC2E"/>
      <circle cx="56" cy="17" r="5" fill="#28C840"/>
      <text class="m" x="228" y="22" font-size="12" text-anchor="middle" fill="#6E86AE">ntlite.log</text>

      <g class="m" font-size="13.5">
        <text class="l1" x="18" y="62" fill="#6E86AE">NTLite v2025.3.10351 x64</text>
        <text class="l2" x="18" y="86" fill="#CFE5FF">install.wim yukleniyor ...</text>
        <text class="l3" x="18" y="110" fill="#CFE5FF">DiagTrack<tspan x="250" fill="#FF7B72">devre disi</tspan></text>
        <text class="l4" x="18" y="134" fill="#CFE5FF">WerSvc<tspan x="250" fill="#FF7B72">devre disi</tspan></text>
        <text class="l5" x="18" y="158" fill="#CFE5FF">RemoteRegistry<tspan x="250" fill="#FF7B72">devre disi</tspan></text>
        <text class="l6" x="18" y="182" fill="#CFE5FF">telemetri gorevleri<tspan x="250" fill="#7EE787">silindi</tspan></text>
        <text class="l7" x="18" y="206" fill="#7EE787">imaj hazir<tspan class="cur" fill="#CFE5FF"> _</tspan></text>
      </g>
      <rect x="18" y="224" width="420" height="6" rx="3" fill="#0F1B30"/>
      <rect class="bar" x="18" y="224" width="420" height="6" rx="3" fill="#2F8CFF"/>
    </g>

    <circle class="dot" cx="1160" cy="318" r="4" fill="#2F8CFF"/>
    <text class="t" x="1148" y="322" font-size="12" text-anchor="end" fill="#4F6A93">anilg12</text>
  </g>
</svg>
